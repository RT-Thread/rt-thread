name: 🚀 Feature Request
description: Suggest an idea for this project
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Please note that feature requests are not 'fire and forget'
        It is a lot more likely that the feature you would like to have will be implemented if you keep watching your feature request, and provide more details to developers looking into implementing your feature, and help them with testing.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Select the area most directly related to the request.
      options:
        - Other / Not sure
        - Kernel
        - Board Support Package (BSP)
        - Device drivers
        - File systems (DFS)
        - Networking
        - IPC
        - FinSH
        - RT-Smart
        - Architecture / libcpu
        - Documentation
        - Build system and tools
        - CI / GitHub Actions
        - Tests and examples
    validations:
      required: true

  - type: dropdown
    id: hardware_vendor
    attributes:
      label: Hardware/BSP vendor
      description: Select the closest vendor family, or Not applicable for generic requests.
      options:
        - Not applicable / Other
        - STM32
        - NXP
        - GD32
        - AT32
        - Infineon
        - Renesas
        - Phytium
        - Cvitek
        - WCH
        - Raspberry Pi
        - Rockchip
        - Loongson
        - ESP32
        - HC32
        - Novosns
        - HPMicro
        - Bluetrum
        - K230
        - Nuvoton
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - Not applicable / Other
        - ARM / AArch64
        - RISC-V
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Describe problem solved by the proposed feature
      description: A clear and concise description of the problem, if any, this feature will solve. E.g. I'm always frustrated when ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe your preferred solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Describe possible alternatives
      description: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false
