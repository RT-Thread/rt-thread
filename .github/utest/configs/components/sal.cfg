# dependencies
CONFIG_RT_CONSOLEBUF_SIZE=1024
CONFIG_RT_NAME_MAX=24
CONFIG_RT_USING_CI_ACTION=y

CONFIG_RT_UTEST_TC_USING_SAL=y
CONFIG_RT_LWIP_NETIF_LOOPBACK=y
CONFIG_BSP_DRV_EMAC=y
# The tcpip thread runs lwIP API callbacks on a debug (-O0) build; the 1024
# default is not enough once the mailbox handoff sits in its receive path.
CONFIG_RT_LWIP_TCPTHREAD_STACKSIZE=2048
