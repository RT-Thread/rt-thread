scons.args: &scons
    scons_arg:
      - '--strict'

# ------ nano ------
nano:
  <<: *scons
  kconfig:
    - CONFIG_RT_USING_NANO=y

# ------ lcd ------
lcd:
  <<: *scons
  kconfig:
    - CONFIG_RT_USING_GRAPHIC=y
    - CONFIG_BSP_USING_LCD=y
    - CONFIG_BSP_LCD_PIXEL_FORMAT_RGB565=y
    - CONFIG_BSP_BITS_PER_PIXEL=16
    - CONFIG_BSP_LCD_WIDTH_PIXEL=800
    - CONFIG_BSP_LCD_HEIGHT_PIXEL=480
    - CONFIG_BSP_LCD_HSYNC_WIDTH_PIXEL=34
    - CONFIG_BSP_LCD_VSYNC_HEIGHT_PIXEL=10
    - CONFIG_BSP_LCD_HBP_PIXEL=46
    - CONFIG_BSP_LCD_VBP_PIXEL=23
    - CONFIG_BSP_LCD_HFP_PIXEL=210
    - CONFIG_BSP_LCD_VFP_PIXEL=22

# ------ sdram ------
sdram:
  <<: *scons
  kconfig:
    - CONFIG_BSP_USING_SDRAM=y
    - CONFIG_BSP_SDRAM_BANK1=y
    - CONFIG_BSP_SDRAM_DATA_WIDTH_32=y
    - CONFIG_BSP_SDRAM_COLUMN_BIT_9=y
    - CONFIG_BSP_SDRAM_ROW_BIT_12=y
    - CONFIG_BSP_SDRAM_CAS_LATENCY_3=y
    - CONFIG_BSP_SDRAM_SIZE=32

# ------ qspi ------
qspi:
  <<: *scons
  kconfig:
    - CONFIG_BSP_USING_QSPI=y
    - CONFIG_BSP_USING_QSPI2=y
