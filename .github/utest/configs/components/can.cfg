# dependencies
CONFIG_RT_CONSOLEBUF_SIZE=1024
CONFIG_RT_USING_CI_ACTION=y

CONFIG_RT_USING_CAN=y
CONFIG_RT_UTEST_CAN_FRAMEWORK=y
# CONFIG_RT_UTEST_CAN is not set

# Allow scheduling margin for the concurrent private-mailbox test.
CONFIG_RT_CANSND_MSG_TIMEOUT=200

# Run CAN framework tests independently of kernel SMP tests.
# CONFIG_RT_UTEST_SMP_AFFFINITY is not set
# CONFIG_RT_UTEST_SMP_ASSIGNED_IDLE_CORE is not set
# CONFIG_RT_UTEST_SMP_INTERRUPT_PRI is not set
# CONFIG_RT_UTEST_SMP_SPINLOCK is not set
# CONFIG_RT_UTEST_SMP_THREAD_PREEMPTION is not set